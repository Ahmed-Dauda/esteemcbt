{% load static %}

<head>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<style>
/* ============================================================
   Finance Records — scoped to .fin-page so it can't leak into
   the rest of the site's styles.
   ============================================================ */
.fin-page {
    --blue:        #2255D4;
    --blue-dark:   #1B44AB;
    --blue-soft:   #EDF2FE;
    --navy:        #1B2A4A;
    --navy-line:   #24365C;
    --ink:         #1F2937;
    --muted:       #6B7280;
    --line:        #E4E8EF;
    --surface:     #FFFFFF;
    --canvas:      #F6F8FB;
    --green:       #0F9D58;
    --green-soft:  #E6F5EC;
    --red:         #DC3545;
    --red-soft:    #FDECEE;
    --amber:       #B7791F;
    --amber-soft:  #FDF4E3;
    --radius:      10px;
    --shadow:      0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);

    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    color: var(--ink);
    background: var(--canvas);
    padding: 24px;
    -webkit-font-smoothing: antialiased;
}

.fin-page *,
.fin-page *::before,
.fin-page *::after { box-sizing: border-box; }

/* ---------- Page header ---------- */
.fin-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
}
.fin-header .fin-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--navy);
}
.fin-header .fin-title i {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: var(--radius);
    background: var(--blue-soft);
    color: var(--blue);
    font-size: 16px;
}
.fin-header .fin-sub {
    margin: 6px 0 0 50px;
    font-size: 13px;
    color: var(--muted);
}
.fin-header-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Buttons ---------- */
.fin-page .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    border-radius: 8px;
    border: 1px solid transparent;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.fin-page .btn i { font-size: 13px; }
.fin-page .btn-primary   { background: var(--blue); color: #fff; }
.fin-page .btn-primary:hover { background: var(--blue-dark); }
.fin-page .btn-success   { background: var(--green); color: #fff; }
.fin-page .btn-success:hover { background: #0C8247; }
.fin-page .btn-ghost     { background: var(--surface); color: var(--ink); border-color: var(--line); }
.fin-page .btn-ghost:hover { background: var(--blue-soft); border-color: #C9D8FA; color: var(--blue-dark); }
.fin-page .btn-link      { background: none; color: var(--muted); padding: 9px 6px; }
.fin-page .btn-link:hover { color: var(--blue); }
.fin-page .btn:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
}

/* ---------- Filter bar ---------- */
.fin-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}
.fin-filters {
    padding: 16px 18px;
    margin-bottom: 18px;
}
.fin-filters form {
    display: grid;
    grid-template-columns: repeat(4, minmax(140px, 1fr)) auto;
    gap: 14px;
    align-items: end;
}
.fin-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fin-field label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
}
.fin-field select {
    appearance: none;
    width: 100%;
    padding: 9px 32px 9px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background-color: #fff;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 15px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
}
.fin-field select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(34,85,212,.12);
}
.fin-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

/* ---------- Toolbar ---------- */
.fin-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
}

/* ---------- Table ---------- */
.fin-table-card { padding: 6px 6px 12px; overflow: hidden; }
.fin-scroll { width: 100%; overflow-x: auto; }

.fin-page table#finance-records {
    width: 100% !important;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
}
.fin-page table#finance-records thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 12px 12px;
    text-align: left;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .02em;
    color: #EAF0FF;
    background: var(--navy);
    border-bottom: 1px solid var(--navy-line);
    white-space: nowrap;
}
.fin-page table#finance-records thead th:first-child { border-top-left-radius: 8px; }
.fin-page table#finance-records thead th:last-child  { border-top-right-radius: 8px; }
.fin-page table#finance-records tbody td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    vertical-align: middle;
    white-space: nowrap;
}
.fin-page table#finance-records tbody tr:nth-child(even) { background: #FBFCFE; }
.fin-page table#finance-records tbody tr:hover { background: var(--blue-soft); }
.fin-page table#finance-records tbody tr:last-child td { border-bottom: none; }

/* Right-align the money columns, centre the action columns */
.fin-page table#finance-records td.num,
.fin-page table#finance-records th.num { text-align: right; font-variant-numeric: tabular-nums; }
.fin-page table#finance-records td.act,
.fin-page table#finance-records th.act { text-align: center; }

/* Sorting arrows on a dark header */
.fin-page table#finance-records thead th.sorting::after,
.fin-page table#finance-records thead th.sorting_asc::after,
.fin-page table#finance-records thead th.sorting_desc::after,
.fin-page table#finance-records thead th.sorting::before,
.fin-page table#finance-records thead th.sorting_asc::before,
.fin-page table#finance-records thead th.sorting_desc::before {
    color: #9DB4E8;
    opacity: .6;
}

/* ---------- Row action buttons ---------- */
.fin-page .act-btn {
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.fin-page .act-btn:hover { background: var(--blue-soft); color: var(--blue); border-color: #C9D8FA; }
.fin-page .act-btn.danger:hover { background: var(--red-soft); color: var(--red); border-color: #F5C2C7; }

/* ---------- Status pills ---------- */
.fin-page .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
}
.fin-page .pill-paid    { background: var(--green-soft); color: var(--green); }
.fin-page .pill-owing   { background: var(--red-soft);   color: var(--red); }
.fin-page .pill-partial { background: var(--amber-soft); color: var(--amber); }

/* ---------- DataTables chrome ---------- */
.fin-page .dataTables_wrapper .dataTables_length,
.fin-page .dataTables_wrapper .dataTables_filter,
.fin-page .dataTables_wrapper .dataTables_info,
.fin-page .dataTables_wrapper .dataTables_paginate {
    font-size: 13px;
    color: var(--muted);
    padding: 10px 12px;
}
.fin-page .dataTables_wrapper .dataTables_length select,
.fin-page .dataTables_wrapper .dataTables_filter input {
    padding: 7px 10px;
    margin: 0 6px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
}
.fin-page .dataTables_wrapper .dataTables_filter input {
    min-width: 220px;
}
.fin-page .dataTables_wrapper .dataTables_length select:focus,
.fin-page .dataTables_wrapper .dataTables_filter input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(34,85,212,.12);
}
.fin-page .dataTables_wrapper .dataTables_paginate .paginate_button {
    padding: 6px 11px !important;
    margin: 0 2px;
    border-radius: 7px !important;
    border: 1px solid var(--line) !important;
    background: #fff !important;
    color: var(--ink) !important;
    font-size: 13px;
}
.fin-page .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
    background: var(--blue-soft) !important;
    border-color: #C9D8FA !important;
    color: var(--blue-dark) !important;
}
.fin-page .dataTables_wrapper .dataTables_paginate .paginate_button.current,
.fin-page .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover {
    background: var(--blue) !important;
    border-color: var(--blue) !important;
    color: #fff !important;
}
.fin-page .dataTables_wrapper .dataTables_paginate .paginate_button.disabled,
.fin-page .dataTables_wrapper .dataTables_paginate .paginate_button.disabled:hover {
    background: #fff !important;
    color: #B6BDC9 !important;
    border-color: var(--line) !important;
    cursor: not-allowed;
}
.fin-page .dataTables_wrapper .dataTables_processing {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    width: auto;
    padding: 10px 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(16,24,40,.12);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
}
.fin-page .dt-spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--blue-soft);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: fin-spin .7s linear infinite;
}
@keyframes fin-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
    .fin-page .dt-spinner { animation-duration: 2s; }
    .fin-page * { transition: none !important; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
    .fin-filters form {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
    }
    .fin-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
    }
}
@media (max-width: 900px) {
    .fin-page { padding: 16px; }
    .fin-header .fin-sub { margin-left: 0; }
}
@media (max-width: 560px) {
    .fin-filters form { grid-template-columns: 1fr; }
    .fin-actions { justify-content: stretch; }
    .fin-actions .btn { flex: 1; justify-content: center; }
    .fin-page .dataTables_wrapper .dataTables_filter input { min-width: 0; width: 100%; }
}
</style>

<div class="fin-page">

    <!-- Page header -->
    <div class="fin-header">
        <div>
            <h2 class="fin-title"><i class="fas fa-wallet"></i> Finance records</h2>
            <p class="fin-sub">Deposits, expenses and balances for every student.</p>
        </div>
        <div class="fin-header-actions">
            <a href="{% url 'finance:finance_summary' %}" class="btn btn-ghost">
                <i class="fas fa-chart-column"></i> Summary
            </a>
            <a href="{% url 'finance:finance_record_add' %}" class="btn btn-success">
                <i class="fas fa-plus"></i> Add record
            </a>
        </div>
    </div>

    <!-- Filters -->
    <div class="fin-card fin-filters">
        <form method="get" action="{% url 'finance:finance_record_view' %}">
            <div class="fin-field">
                <label for="school"><i class="fas fa-school"></i> School</label>
                <select name="school" id="school">
                    <option value="">All schools</option>
                    {% for school in schools %}
                        <option value="{{ school.id }}" {% if school.id|stringformat:"s" == school_filter %}selected{% endif %}>
                            {{ school }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="fin-field">
                <label for="session"><i class="fas fa-calendar-days"></i> Session</label>
                <select name="session" id="session">
                    <option value="" {% if not session_filter %}selected{% endif %}>All sessions</option>
                    {% for s in sessions %}
                        <option value="{{ s.id }}" {% if s.id|stringformat:"s" == session_filter %}selected{% endif %}>
                            {{ s.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="fin-field">
                <label for="term"><i class="fas fa-calendar-check"></i> Term</label>
                <select name="term" id="term">
                    <option value="" {% if not term_filter %}selected{% endif %}>All terms</option>
                    {% for t in terms %}
                        <option value="{{ t.id }}" {% if t.id|stringformat:"s" == term_filter %}selected{% endif %}>
                            {{ t.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="fin-field">
                <label for="class"><i class="fas fa-users"></i> Class</label>
                <select name="class" id="class">
                    <option value="">All classes</option>
                    {% for c in classes %}
                        <option value="{{ c }}" {% if c == class_filter %}selected{% endif %}>
                            {{ c }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="fin-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-filter"></i> Apply
                </button>
                <a href="{% url 'finance:finance_record_view' %}" class="btn btn-link">
                    <i class="fas fa-rotate-left"></i> Reset
                </a>
            </div>
        </form>
    </div>

    <!-- Toolbar -->
    <div class="fin-toolbar">
        <a href="{% url 'finance:finance_record_export' %}" class="btn btn-ghost">
            <i class="fas fa-file-arrow-down"></i> Export
        </a>
        <a href="{% url 'finance:finance_record_import' %}" class="btn btn-ghost">
            <i class="fas fa-file-arrow-up"></i> Import
        </a>
    </div>

    <!-- Table -->
    <div class="fin-card fin-table-card">
        <div class="fin-scroll">
            <table id="finance-records" class="display">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Week</th>
                        <th class="num">Deposit</th>
                        <th class="num">Cum. balance</th>
                        <th class="num">School shop</th>
                        <th class="num">Caps</th>
                        <th class="num">Haircut</th>
                        <th class="num">Others</th>
                        <th class="num">Total expense</th>
                        <th class="num">Balance</th>
                        <th class="num">BBF</th>
                        <th class="act">Status</th>
                        <th class="act">Receipt</th>
                        <th class="act">Edit</th>
                        <th class="act">Delete</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {
    // Preserve the current school/session/term/class filters on every AJAX call
    var currentFilters = window.location.search || '';

    $('#finance-records').DataTable({
        processing: true,
        serverSide: true,
        deferRender: true,
        pageLength: 25,
        lengthMenu: [10, 25, 50, 100, 250],
        order: [[1, 'desc']],   // sort by Week descending by default
        ajax: {
            url: "{% url 'finance:finance_record_view' %}" + currentFilters,
            type: 'GET'
        },
        columns: [
            { data: 'names' },
            { data: 'week_start' },
            { data: 'initial_total_deposit' },
            { data: 'total_deposit' },
            { data: 'school_shop' },
            { data: 'caps' },
            { data: 'haircut' },
            { data: 'others' },
            { data: 'total_expense' },
            { data: 'current_balance' },
            { data: 'balance_brought_forward' },
            { data: 'status',  orderable: false },
            { data: 'receipt', orderable: false, searchable: false },
            { data: 'edit',    orderable: false, searchable: false },
            { data: 'delete',  orderable: false, searchable: false }
        ],
        columnDefs: [
            { targets: [2, 3, 4, 5, 6, 7, 8, 9, 10], className: 'num' },
            { targets: [11, 12, 13, 14], className: 'act' }
        ],
        language: {
            processing:  '<span class="dt-spinner"></span> Loading records…',
            search:      '<i class="fas fa-magnifying-glass"></i>',
            searchPlaceholder: 'Search name, class, or status…',
            lengthMenu:  'Show _MENU_ rows',
            info:        'Showing _START_–_END_ of _TOTAL_ records',
            infoEmpty:   'No records',
            infoFiltered: '(filtered from _MAX_ total)',
            zeroRecords: 'No records match that search.',
            emptyTable:  'No finance records for the selected filters. Add one to get started.',
            paginate: {
                first:    '<i class="fas fa-angles-left"></i>',
                previous: '<i class="fas fa-angle-left"></i>',
                next:     '<i class="fas fa-angle-right"></i>',
                last:     '<i class="fas fa-angles-right"></i>'
            }
        }
    });
});
</script>
