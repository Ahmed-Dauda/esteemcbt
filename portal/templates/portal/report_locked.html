{% extends "base.html" %}
{% block content %}
<div class="container py-5 text-center" style="max-width:560px;">
  <div style="font-size:3rem;">🔒</div>
  <h3 class="mt-3">Report Card Not Available</h3>
  <p class="text-muted">{{ student.display_name }} — {{ session }} {{ term }}</p>
  <div class="alert alert-warning mt-3">{{ reason }}</div>
  <p class="small text-muted">
    Please contact the school accounts / exam office if you believe your
    fees for this term have been settled.
  </p>
  <a href="{% url 'portal:my_report_cards' %}" class="btn btn-primary mt-2">← Back</a>
</div>
{% endblock %}
